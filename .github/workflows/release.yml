name: Release build

# Builds the release DMG on request and keeps it as a workflow artifact. It does not
# publish: releases are cut with Scripts/release.sh, which signs every update for the
# in-app feed (ADR-0108). If this workflow uploaded an asset after that, the bytes would no
# longer match the appcast's EdDSA signature, and every update to that version would fail.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ inputs.tag }}

jobs:
  release:
    name: Build DMG
    runs-on: macos-26
    # Secrets cannot be read in `if:` directly, so they are mapped into env
    # once and the optional signing steps gate on the env values. With no
    # secrets configured (the current state) every signing step skips cleanly
    # and the DMG holds the ad-hoc-signed app from the checked-in project
    # (ADR-0018).
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Read the pinned Xcode version
        id: xcode
        # Unpinned Xcode is the top cause of "CI broke and nobody changed anything".
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != '' && env.APPLE_TEAM_ID != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # Hand the script real signing; without these it builds ad hoc.
          echo "CODE_SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
          echo "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" >> "$GITHUB_ENV"

      - name: Build and package the DMG
        run: VERSION_TAG="$RELEASE_TAG" Scripts/make-dmg.sh build

      - name: Notarize and staple
        if: env.NOTARY_APPLE_ID != '' && env.NOTARY_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          DMG="$(ls build/NextcloudMail-*.dmg)"
          xcrun notarytool submit "$DMG" --wait \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$DMG"

      - name: Keep the DMG
        uses: actions/upload-artifact@v4
        with:
          name: NextcloudMail-${{ env.RELEASE_TAG }}
          path: build/NextcloudMail-*.dmg
